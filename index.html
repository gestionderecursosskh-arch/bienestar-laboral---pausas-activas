<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pausas Activas · SKANHAWK HSE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F6F9;--sur:#FFF;--bor:#E4E8EF;--txt:#0F172A;--mid:#475569;--dim:#94A3B8;
  --blue:#2563EB;--bl:#EFF6FF;--bm:#BFDBFE;--grn:#10B981;--amb:#F59E0B;
  --shl:0 8px 32px rgba(0,0,0,.10);--sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06)}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 24px;gap:32px;-webkit-font-smoothing:antialiased}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.brand{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--dim)}
.ttl{font-family:"DM Serif Display",serif;font-size:42px;color:var(--txt);text-align:center;line-height:1.05}
.ttl span{color:var(--blue)}
.sub{font-size:14px;color:var(--mid);font-weight:300;text-align:center;line-height:1.7;max-width:320px}
.card{background:var(--sur);border-radius:24px;box-shadow:var(--shl);width:100%;
  max-width:420px;padding:36px 32px;display:flex;flex-direction:column;gap:28px;border:1px solid var(--bor)}
.day-banner{background:var(--bl);border:1px solid var(--bm);border-radius:14px;
  padding:14px 18px;display:flex;align-items:center;gap:12px}
.day-icon{font-size:22px;flex-shrink:0}
.day-info .day-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.day-info .day-name{font-size:14px;font-weight:600;color:var(--txt)}
.hq{font-family:"DM Serif Display",serif;font-size:24px;color:var(--txt);text-align:center;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px;background:var(--bg);
  border:1.5px solid var(--bor);border-radius:16px;padding:20px 22px;
  cursor:pointer;transition:all .2s;text-decoration:none}
.opt:hover{border-color:var(--blue);background:var(--bl);transform:translateY(-2px);box-shadow:var(--sh)}
.opt:active{transform:scale(.98)}
.oic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex-shrink:0}
.oic.ca{background:#FEF3C7}.oic.of{background:var(--bl)}
.oname{font-size:17px;font-weight:600;color:var(--txt)}
.ochev{margin-left:auto;color:var(--dim);flex-shrink:0}
.footer{display:flex;flex-direction:column;align-items:center;gap:6px}
.footer-brand{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.footer-tag{font-size:11px;color:var(--dim);font-weight:300}
</style>
</head>
<body>
<div class="logo">
  <span class="brand">SKANHAWK SAS · HSE</span>
  <div class="ttl">Pausas<br><span>Activas</span></div>
  <p class="sub">Programa de bienestar laboral y prevención de lesiones osteomusculares.</p>
</div>

<div class="card">
  <div class="day-banner">
    <div class="day-icon" id="dayIcon">📅</div>
    <div class="day-info">
      <div class="day-lbl">Rutina de hoy</div>
      <div class="day-name" id="dayName">Cargando...</div>
    </div>
  </div>

  <div class="hq">¿En qué lugar<br>estás ubicado?</div>

  <div class="opts">
    <a class="opt" href="pausas_campo_v4.html">
      <div class="oic ca">⛑</div>
      <div><div class="oname">Campo</div></div>
      <svg class="ochev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a class="opt" href="pausas_oficina_v5.html">
      <div class="oic of">💻</div>
      <div><div class="oname">Oficina</div></div>
      <svg class="ochev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
</div>

<div class="footer">
  <span class="footer-brand">SKANHAWK SAS</span>
  <span class="footer-tag">Programa Bienestar Laboral · HSE</span>
</div>

<script>
const DIAS = {
  0: {nombre:'Descanso Activo',    icono:'🧘', cat:'domingo'},
  1: {nombre:'Activación Semanal', icono:'⚡', cat:'lunes'},
  2: {nombre:'Cuello y Hombros',   icono:'🔄', cat:'martes'},
  3: {nombre:'Columna y Core',     icono:'🦴', cat:'miercoles'},
  4: {nombre:'Circulación y Piernas', icono:'🦵', cat:'jueves'},
  5: {nombre:'Cierre de Semana',   icono:'🌅', cat:'viernes'},
  6: {nombre:'Hombros y Brazos',   icono:'💪', cat:'sabado'}
};
const hoy = new Date().getDay();
const info = DIAS[hoy];
document.getElementById('dayIcon').textContent = info.icono;
document.getElementById('dayName').textContent = info.nombre;
</script>
</body>
</html>
